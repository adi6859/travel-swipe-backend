# Local development stack. Independent from Krozd: own database, own port (5433).
#   docker compose -f deploy/docker-compose.yml up -d postgres
#   docker compose -f deploy/docker-compose.yml --profile app up --build
name: travel-swipe

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel_swipe
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_swipe"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://travel:travel@postgres:5432/travel_swipe?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://travel:travel@postgres:5432/travel_swipe?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
