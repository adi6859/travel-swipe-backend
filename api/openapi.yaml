openapi: 3.1.0
info:
  title: Travel Swipe API
  version: 0.5.0
  description: |
    Backend for the travel platform. Authentication is passwordless phone OTP.

    All timestamps are RFC 3339 in UTC. Every error response uses the `Error`
    envelope; clients should branch on `error.code`, never on `error.message`.

    Clients must serialize refresh calls per device: two parallel refreshes with
    the same refresh token are treated as token reuse and revoke the session.

    Money is integer paise (1 INR = 100 paise) with an explicit `currency`.
    Calendar dates are `YYYY-MM-DD`; "upcoming" means on or after today's date
    in India.

    `/admin/v1` routes exist only when the server is configured with an admin
    token hash, and use a separate static bearer token.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes for orchestrators.
  - name: auth
    description: Phone OTP sign-in, token refresh and session revocation.
  - name: users
    description: The signed-in user's account and profile.
  - name: travel-profile
    description: How the user likes to travel; inputs to matching.
  - name: trips
    description: The trip catalogue (Explore, trip detail, booking hand-off).
  - name: admin-ingest
    description: Catalogue sources, their content rights, and listing imports.
  - name: admin-trips
    description: Trip moderation.

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: healthz
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe (checks the database)
      operationId: readyz
      security: []
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/auth/otp/request:
    post:
      tags: [auth]
      summary: Send a login OTP by SMS
      description: |
        Creates an OTP challenge for the phone and sends the code by SMS. Works
        for new and existing users alike. Limited by a resend cooldown, a daily
        per-phone cap and a per-IP rate limit.
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { $ref: "#/components/schemas/PhoneE164" }
      responses:
        "202":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, expires_at, resend_after]
                properties:
                  challenge_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
                  resend_after: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify an OTP and sign in
      description: |
        Verifies the latest OTP for the phone. Creates the account on first
        login. Each wrong code counts as an attempt; after the maximum the
        challenge is locked and a new OTP must be requested.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { $ref: "#/components/schemas/PhoneE164" }
                code: { type: string, pattern: "^[0-9]{4,8}$", example: "123456" }
                device_name: { type: string, maxLength: 100, example: "Pixel 8" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401":
          description: "`OTP_INVALID` or `OTP_EXPIRED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "429":
          description: "`OTP_ATTEMPTS_EXCEEDED` or the per-IP rate limit (`too_many_requests`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and issue a new access token
      description: |
        Refresh tokens are single use. Presenting an already-used token revokes
        the whole session (`SESSION_REVOKED`).
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, maxLength: 512 }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401":
          description: "`REFRESH_TOKEN_INVALID` or `SESSION_REVOKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      operationId: logout
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/auth/logout-all:
    post:
      tags: [auth]
      summary: Revoke every session of the current user, including this one
      operationId: logoutAll
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked_sessions]
                properties:
                  revoked_sessions: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/users/me:
    get:
      tags: [users]
      summary: Get the signed-in user's account and profile
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      summary: Partially update the signed-in user's profile
      description: |
        An omitted key leaves the field unchanged, `null` clears it, and a value
        sets it. Unknown keys (including `phone`, `status`, `id`) are rejected.
        All invalid fields are reported together in `error.details`.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePatch" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/travel-profile/options:
    get:
      tags: [travel-profile]
      summary: List every allowed travel profile value
      description: Clients render pickers from this; values are stable, labels may change.
      operationId: getTravelProfileOptions
      responses:
        "200":
          description: Allowed values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TravelProfileOptions" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/users/me/travel-profile:
    get:
      tags: [travel-profile]
      summary: Get the signed-in user's travel profile
      description: "Returns empty lists, null fields and `updated_at: null` until the first save."
      operationId: getMyTravelProfile
      responses:
        "200":
          description: Travel profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TravelProfile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
    put:
      tags: [travel-profile]
      summary: Replace the signed-in user's travel profile
      description: |
        Full replacement: an omitted or null list is saved as empty, and an
        omitted or null field is cleared. Values are trimmed and lower-cased;
        duplicates are removed. Unknown keys are rejected. All invalid fields
        are reported together in `error.details`.
      operationId: replaceMyTravelProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TravelProfileInput" }
      responses:
        "200":
          description: Saved travel profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TravelProfile" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountSuspended" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/trips:
    get:
      tags: [trips]
      summary: Explore published trips
      description: |
        Filters combine with AND. `month`, `departure_city` and `max_price_inr`
        must all hold for the same upcoming, not sold-out departure.
        `next_cursor` is bound to the filters and sort that produced it; reuse
        it only with the same query (page size may change).
      operationId: listTrips
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Prefix and typo-tolerant search over title, destination and region." }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/CategoryKey" } }
        - { name: interest, in: query, schema: { $ref: "#/components/schemas/InterestSlug" } }
        - { name: difficulty, in: query, schema: { $ref: "#/components/schemas/Difficulty" } }
        - { name: min_days, in: query, schema: { type: integer, minimum: 1, maximum: 60 } }
        - { name: max_days, in: query, schema: { type: integer, minimum: 1, maximum: 60 } }
        - { name: max_price_inr, in: query, schema: { type: integer, minimum: 0 }, description: Whole rupees. }
        - { name: month, in: query, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }, example: "2026-12" }
        - { name: departure_city, in: query, schema: { type: string, maxLength: 100 }, description: Case-insensitive exact match. }
        - name: sort
          in: query
          description: Defaults to `relevance` when `q` is set, otherwise `popular`. `relevance` requires `q`.
          schema: { type: string, enum: [relevance, popular, price_asc, soonest] }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of trips
          content:
            application/json:
              schema:
                type: object
                required: [trips, next_cursor]
                properties:
                  trips: { type: array, items: { $ref: "#/components/schemas/TripCard" } }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/trips/categories:
    get:
      tags: [trips]
      summary: Explore categories with published trip counts
      operationId: listTripCategories
      responses:
        "200":
          description: Categories in display order
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      required: [key, label, count]
                      properties:
                        key: { $ref: "#/components/schemas/CategoryKey" }
                        label: { type: string }
                        count: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/trips/{id}:
    get:
      tags: [trips]
      summary: Get a trip
      description: |
        Published and expired trips are viewable (expired ones have
        `bookable: false`); drafts and hidden trips return 404. Only images the
        source allows us to display are listed, and only upcoming departures.
      operationId: getTrip
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Trip detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/trips/{id}/outbound:
    post:
      tags: [trips]
      summary: Get the provider booking link (records the click)
      description: Booking happens on the provider's site; open the returned URL.
      operationId: tripOutbound
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                departure_id: { type: string, format: uuid, description: A current departure of this trip. }
      responses:
        "200":
          description: Booking link
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri, pattern: "^https://" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/v1/sources:
    get:
      tags: [admin-ingest]
      summary: List catalogue sources
      operationId: adminListSources
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }

  /admin/v1/sources/{key}:
    put:
      tags: [admin-ingest]
      summary: Create or update a source and its content rights
      description: |
        Rights changes apply to existing trips immediately: image visibility
        follows `image_allowed`; revoking `description_allowed` erases stored
        descriptions, itinerary text and inclusions; losing publish rights moves
        published and expired trips to draft. Widening rights makes the next
        import rewrite every listing. `research_only` sources can never publish.
      operationId: adminPutSource
      security: [{ adminToken: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { $ref: "#/components/schemas/SourceKey" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "200":
          description: Saved source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }

  /admin/v1/sources/{key}/imports:
    post:
      tags: [admin-ingest]
      summary: Import a batch of listings from a source
      description: |
        Invalid listings are rejected individually (see `rejections`); the rest
        are applied in one transaction. Imports for one source are serialized.
        Unchanged listings are skipped. With `complete: true` the batch is the
        source's full current catalogue: listings missing from
        `missing_grace_runs` consecutive complete runs expire, and reappear as
        published if they come back. Rejected listings still count as seen.
      operationId: adminImportListings
      security: [{ adminToken: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { $ref: "#/components/schemas/SourceKey" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: Finished run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestRun" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/v1/sources/{key}/runs:
    get:
      tags: [admin-ingest]
      summary: Recent import runs, newest first
      operationId: adminListRuns
      security: [{ adminToken: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { $ref: "#/components/schemas/SourceKey" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/IngestRun" } }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/v1/trips:
    get:
      tags: [admin-trips]
      summary: List trips in any status, most recently updated first
      operationId: adminListTrips
      security: [{ adminToken: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TripStatus" } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/SourceKey" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Trips
          content:
            application/json:
              schema:
                type: object
                required: [trips]
                properties:
                  trips: { type: array, items: { $ref: "#/components/schemas/AdminTrip" } }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }

  /admin/v1/trips/{id}/publish:
    post:
      tags: [admin-trips]
      summary: Publish a trip
      description: Fails with `conflict` when the trip's source rights do not allow publishing.
      operationId: adminPublishTrip
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Published }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/v1/trips/{id}/hide:
    post:
      tags: [admin-trips]
      summary: Hide a trip from the app
      description: Imports never un-hide a trip; only publish does.
      operationId: adminHideTrip
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "204": { description: Hidden }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/AdminUnauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminToken:
      type: http
      scheme: bearer
      description: Static admin token; the server stores only its SHA-256 hash (ADMIN_API_TOKEN_SHA256).

  schemas:
    PhoneE164:
      type: string
      pattern: "^\\+[1-9][0-9]{7,14}$"
      example: "+919876543210"

    TokenPair:
      type: object
      required: [token_type, session_id, access_token, access_expires_at, refresh_token, refresh_expires_at]
      properties:
        token_type: { type: string, const: Bearer }
        session_id: { type: string, format: uuid }
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [user, is_new_user]
          properties:
            is_new_user: { type: boolean }
            user:
              type: object
              required: [id, phone, status, created_at]
              properties:
                id: { type: string, format: uuid }
                phone: { $ref: "#/components/schemas/PhoneE164" }
                status: { $ref: "#/components/schemas/UserStatus" }
                created_at: { type: string, format: date-time }

    UserStatus:
      type: string
      enum: [active, suspended]

    Gender:
      type: string
      enum: [male, female, non_binary, prefer_not_to_say]

    Avatar:
      type: object
      required: [url, width, height, mime_type, size_bytes]
      properties:
        url: { type: string, format: uri, pattern: "^https://", maxLength: 2048 }
        width: { type: integer, minimum: 1, maximum: 10000 }
        height: { type: integer, minimum: 1, maximum: 10000 }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, image/heic] }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }

    Me:
      type: object
      required: [id, phone, status, created_at, last_login_at, profile_complete, profile]
      properties:
        id: { type: string, format: uuid }
        phone: { $ref: "#/components/schemas/PhoneE164" }
        status: { $ref: "#/components/schemas/UserStatus" }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
        profile_complete:
          type: boolean
          description: True once display_name and date_of_birth are set.
        profile:
          type: object
          required: [display_name, bio, avatar, date_of_birth, gender, home_city, country_code, updated_at]
          properties:
            display_name: { type: string, description: Empty string when not set. }
            bio: { type: string, description: Empty string when not set. }
            avatar:
              oneOf:
                - $ref: "#/components/schemas/Avatar"
                - type: "null"
            date_of_birth: { type: [string, "null"], format: date }
            gender:
              oneOf:
                - $ref: "#/components/schemas/Gender"
                - type: "null"
            home_city: { type: [string, "null"] }
            country_code: { type: [string, "null"], pattern: "^[A-Z]{2}$" }
            updated_at: { type: string, format: date-time }

    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: [string, "null"], minLength: 1, maxLength: 60 }
        bio: { type: [string, "null"], minLength: 1, maxLength: 500 }
        avatar:
          oneOf:
            - $ref: "#/components/schemas/Avatar"
            - type: "null"
        date_of_birth:
          type: [string, "null"]
          format: date
          description: User must be at least 18 and at most 120 years old.
        gender:
          oneOf:
            - $ref: "#/components/schemas/Gender"
            - type: "null"
        home_city: { type: [string, "null"], minLength: 1, maxLength: 100 }
        country_code:
          type: [string, "null"]
          pattern: "^[A-Za-z]{2}$"
          description: ISO 3166-1 alpha-2; stored upper-cased.

    TravelStyle:
      type: string
      enum: [backpacker, comfort, luxury, adventure, slow, offbeat, workation]
    BudgetBand:
      type: string
      enum: [shoestring, budget, mid_range, premium, luxury]
    GroupSize:
      type: string
      enum: [small, medium, large, any]
    Pace:
      type: string
      enum: [relaxed, balanced, packed]
    Habit:
      type: string
      enum: [never, sometimes, regularly]
    Diet:
      type: string
      enum: [no_preference, vegetarian, eggetarian, vegan, jain, non_vegetarian]
    LanguageCode:
      type: string
      pattern: "^[a-z]{2}$"
      description: ISO 639-1 code from the options endpoint.
    InterestSlug:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,39}$"
      description: An active interest slug from the options endpoint.

    TravelProfile:
      type: object
      required: [travel_styles, interests, languages, budget_band, group_size, pace, smoking, drinking, diet, complete, updated_at]
      properties:
        travel_styles: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/TravelStyle" } }
        interests: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/InterestSlug" } }
        languages: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/LanguageCode" } }
        budget_band: { oneOf: [{ $ref: "#/components/schemas/BudgetBand" }, { type: "null" }] }
        group_size: { oneOf: [{ $ref: "#/components/schemas/GroupSize" }, { type: "null" }] }
        pace: { oneOf: [{ $ref: "#/components/schemas/Pace" }, { type: "null" }] }
        smoking: { oneOf: [{ $ref: "#/components/schemas/Habit" }, { type: "null" }] }
        drinking: { oneOf: [{ $ref: "#/components/schemas/Habit" }, { type: "null" }] }
        diet: { oneOf: [{ $ref: "#/components/schemas/Diet" }, { type: "null" }] }
        complete:
          type: boolean
          description: True with at least one travel style, three interests, one language and a budget band.
        updated_at: { type: [string, "null"], format: date-time }

    TravelProfileInput:
      type: object
      additionalProperties: false
      properties:
        travel_styles: { type: [array, "null"], items: { type: string }, description: "At most 3 distinct values." }
        interests: { type: [array, "null"], items: { type: string }, description: "At most 10 distinct active slugs." }
        languages: { type: [array, "null"], items: { type: string }, description: "At most 8 distinct codes." }
        budget_band: { type: [string, "null"] }
        group_size: { type: [string, "null"] }
        pace: { type: [string, "null"] }
        smoking: { type: [string, "null"] }
        drinking: { type: [string, "null"] }
        diet: { type: [string, "null"] }

    Option:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }

    TravelProfileOptions:
      type: object
      required: [travel_styles, interests, languages, budget_bands, group_sizes, paces, smoking, drinking, diets]
      properties:
        travel_styles: { type: array, items: { $ref: "#/components/schemas/Option" } }
        interests:
          type: array
          items:
            type: object
            required: [slug, label, category]
            properties:
              slug: { $ref: "#/components/schemas/InterestSlug" }
              label: { type: string }
              category: { type: string, enum: [outdoors, culture, food_drink, leisure] }
        languages: { type: array, items: { $ref: "#/components/schemas/Option" } }
        budget_bands: { type: array, items: { $ref: "#/components/schemas/Option" } }
        group_sizes: { type: array, items: { $ref: "#/components/schemas/Option" } }
        paces: { type: array, items: { $ref: "#/components/schemas/Option" } }
        smoking: { type: array, items: { $ref: "#/components/schemas/Option" } }
        drinking: { type: array, items: { $ref: "#/components/schemas/Option" } }
        diets: { type: array, items: { $ref: "#/components/schemas/Option" } }

    CategoryKey:
      type: string
      enum: [treks, mountains, beaches, road_trips, weekend, international]
    Difficulty:
      type: string
      enum: [easy, moderate, difficult, challenging]
    Availability:
      type: string
      enum: [available, filling_fast, waitlist, sold_out, unknown]
    TripStatus:
      type: string
      enum: [draft, published, hidden, expired]
    Currency:
      type: string
      const: INR
    CalendarDate:
      type: string
      format: date
      example: "2026-12-20"

    TripCard:
      type: object
      required: [id, slug, title, destination, region, country_code, duration_days, duration_nights, difficulty, rating,
        review_count, max_group_size, provider, next_departure_date, min_price_paise, currency, cover_image_url, interests]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        destination: { type: string }
        region: { type: [string, "null"] }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
        duration_days: { type: integer, minimum: 1 }
        duration_nights: { type: integer, minimum: 0 }
        difficulty: { oneOf: [{ $ref: "#/components/schemas/Difficulty" }, { type: "null" }] }
        rating: { type: [number, "null"], minimum: 0, maximum: 5 }
        review_count: { type: [integer, "null"], minimum: 0 }
        max_group_size: { type: [integer, "null"] }
        provider:
          type: object
          required: [name, slug]
          properties:
            name: { type: string }
            slug: { type: string }
        next_departure_date:
          oneOf: [{ $ref: "#/components/schemas/CalendarDate" }, { type: "null" }]
          description: Earliest upcoming departure that is not sold out.
        min_price_paise:
          type: [integer, "null"]
          description: Lowest price among upcoming departures that are not sold out.
        currency: { $ref: "#/components/schemas/Currency" }
        cover_image_url: { type: [string, "null"], format: uri }
        interests: { type: array, items: { $ref: "#/components/schemas/InterestSlug" } }

    Departure:
      type: object
      required: [id, start_date, end_date, departure_city, price_paise, original_price_paise, currency, availability, seats_left]
      properties:
        id: { type: string, format: uuid }
        start_date: { $ref: "#/components/schemas/CalendarDate" }
        end_date: { $ref: "#/components/schemas/CalendarDate" }
        departure_city: { type: [string, "null"] }
        price_paise: { type: [integer, "null"], minimum: 0 }
        original_price_paise: { type: [integer, "null"], description: Pre-discount price when the provider shows one. }
        currency: { $ref: "#/components/schemas/Currency" }
        availability: { $ref: "#/components/schemas/Availability" }
        seats_left: { type: [integer, "null"], minimum: 0 }

    TripDetail:
      type: object
      required: [id, slug, title, summary, description, destination, region, country_code, coordinates, duration_days,
        duration_nights, difficulty, max_group_size, min_age, rating, review_count, status, bookable, attribution,
        provider, interests, images, itinerary, included, excluded, departures]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, "null"] }
        description: { type: [string, "null"], description: Paragraphs separated by newlines; null when the source does not allow text. }
        destination: { type: string }
        region: { type: [string, "null"] }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
        coordinates:
          oneOf:
            - type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number }
                longitude: { type: number }
            - type: "null"
        duration_days: { type: integer }
        duration_nights: { type: integer }
        difficulty: { oneOf: [{ $ref: "#/components/schemas/Difficulty" }, { type: "null" }] }
        max_group_size: { type: [integer, "null"] }
        min_age: { type: [integer, "null"] }
        rating: { type: [number, "null"] }
        review_count: { type: [integer, "null"] }
        status: { type: string, enum: [published, expired] }
        bookable: { type: boolean }
        attribution: { type: [string, "null"], description: Show near the content when present. }
        provider:
          type: object
          required: [name, slug, website_url, rating, review_count]
          properties:
            name: { type: string }
            slug: { type: string }
            website_url: { type: [string, "null"], format: uri }
            rating: { type: [number, "null"] }
            review_count: { type: [integer, "null"] }
        interests: { type: array, items: { $ref: "#/components/schemas/InterestSlug" } }
        images:
          type: array
          items:
            type: object
            required: [url, width, height]
            properties:
              url: { type: string, format: uri }
              width: { type: [integer, "null"] }
              height: { type: [integer, "null"] }
        itinerary:
          type: array
          items:
            type: object
            required: [day, title, description]
            properties:
              day: { type: integer, minimum: 1 }
              title: { type: string }
              description: { type: [string, "null"] }
        included: { type: array, items: { type: string } }
        excluded: { type: array, items: { type: string } }
        departures: { type: array, items: { $ref: "#/components/schemas/Departure" } }

    SourceKey:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,39}$"
    RightsBasis:
      type: string
      enum: [first_party, contract, affiliate, api_terms, official_publication, research_only]
      description: Why we may use this source's content. `research_only` content is never published.

    SourceInput:
      type: object
      additionalProperties: false
      required: [display_name, base_url, rights_basis, evidence_ref]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        base_url: { type: string, format: uri }
        enabled: { type: boolean, default: true }
        auto_publish: { type: boolean, default: false, description: Publish new trips on import. }
        rights_basis: { $ref: "#/components/schemas/RightsBasis" }
        image_allowed: { type: boolean, default: false }
        description_allowed: { type: boolean, default: false }
        attribution_text: { type: [string, "null"], maxLength: 200 }
        evidence_ref: { type: string, minLength: 1, maxLength: 500, description: Link or note proving the rights. }
        rights_expires_at: { type: [string, "null"], format: date-time, description: "After this, the source's trips disappear from the app." }
        missing_grace_runs: { type: integer, minimum: 1, maximum: 30, default: 2 }

    Source:
      type: object
      required: [source_key, display_name, base_url, enabled, auto_publish, rights_basis, image_allowed,
        description_allowed, attribution_text, evidence_ref, rights_expires_at, missing_grace_runs, updated_at]
      properties:
        source_key: { $ref: "#/components/schemas/SourceKey" }
        display_name: { type: string }
        base_url: { type: string, format: uri }
        enabled: { type: boolean }
        auto_publish: { type: boolean }
        rights_basis: { $ref: "#/components/schemas/RightsBasis" }
        image_allowed: { type: boolean }
        description_allowed: { type: boolean }
        attribution_text: { type: [string, "null"] }
        evidence_ref: { type: string }
        rights_expires_at: { type: [string, "null"], format: date-time }
        missing_grace_runs: { type: integer }
        updated_at: { type: string, format: date-time }

    ImportRequest:
      type: object
      additionalProperties: false
      required: [listings]
      properties:
        trigger: { type: string, enum: [scraper, manual, seed], default: manual }
        complete: { type: boolean, default: false, description: The batch is the source's full current catalogue. }
        listings: { type: array, minItems: 1, maxItems: 200, items: { $ref: "#/components/schemas/Listing" } }

    Listing:
      type: object
      additionalProperties: false
      description: |
        One trip as published by the source. Text is whitespace-normalized;
        summary, description, itinerary text and inclusions are truncated to
        their limits rather than rejected. Description, itinerary text and
        inclusions are stored only when the source allows text; images are
        stored but shown only when it allows images.
      required: [external_id, source_url, booking_url, provider, title, destination, duration_days, duration_nights]
      properties:
        external_id: { type: string, minLength: 1, maxLength: 200, description: Stable ID within the source. }
        source_url: { type: string, format: uri }
        booking_url: { type: string, format: uri, pattern: "^https://" }
        provider:
          type: object
          additionalProperties: false
          required: [slug, name]
          properties:
            slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,59}$" }
            name: { type: string, maxLength: 100 }
            website_url: { type: string, format: uri }
            rating: { type: number, minimum: 0, maximum: 5 }
            review_count: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 150 }
        summary: { type: string, description: Truncated to 300 characters. }
        description: { type: string, description: Truncated to 10000 characters. }
        destination: { type: string, minLength: 1, maxLength: 100 }
        region: { type: string, maxLength: 100 }
        country_code: { type: string, pattern: "^[A-Za-z]{2}$", default: IN }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        duration_days: { type: integer, minimum: 1, maximum: 60 }
        duration_nights: { type: integer, minimum: 0, description: At most duration_days. }
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        max_group_size: { type: integer, minimum: 1, maximum: 200 }
        min_age: { type: integer, minimum: 0, maximum: 99 }
        rating: { type: number, minimum: 0, maximum: 5 }
        review_count: { type: integer, minimum: 0 }
        interests: { type: array, items: { $ref: "#/components/schemas/InterestSlug" } }
        images:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [url]
            properties:
              url: { type: string, format: uri, pattern: "^https://" }
              width: { type: integer, minimum: 1 }
              height: { type: integer, minimum: 1 }
        itinerary:
          type: array
          maxItems: 60
          items:
            type: object
            additionalProperties: false
            required: [day, title]
            properties:
              day: { type: integer, minimum: 1, maximum: 60 }
              title: { type: string, minLength: 1 }
              description: { type: string }
        inclusions: { type: array, maxItems: 50, items: { type: string } }
        exclusions: { type: array, maxItems: 50, items: { type: string } }
        departures:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [start_date, end_date]
            properties:
              external_id: { type: string, maxLength: 200, description: "Optional; otherwise departures are identified by start date and city." }
              start_date: { $ref: "#/components/schemas/CalendarDate" }
              end_date: { $ref: "#/components/schemas/CalendarDate" }
              departure_city: { type: string, maxLength: 100 }
              price_inr: { type: number, minimum: 0, maximum: 10000000 }
              original_price_inr: { type: number, minimum: 0, maximum: 10000000 }
              availability: { $ref: "#/components/schemas/Availability" }
              seats_left: { type: integer, minimum: 0 }

    IngestRun:
      type: object
      required: [id, trigger, complete, status, started_at, finished_at, received, inserted, updated, unchanged,
        rejected, expired, rejections]
      properties:
        id: { type: string, format: uuid }
        trigger: { type: string, enum: [scraper, manual, seed] }
        complete: { type: boolean }
        status: { type: string, enum: [running, succeeded, partial, failed] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        received: { type: integer }
        inserted: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        rejected: { type: integer }
        expired: { type: integer }
        rejections:
          type: array
          items:
            type: object
            required: [index, errors]
            properties:
              index: { type: integer, description: Position in the submitted listings array. }
              external_id: { type: string }
              errors: { type: object, additionalProperties: { type: string } }

    AdminTrip:
      type: object
      required: [id, title, destination, status, status_reason, source_key, provider_name, published_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        destination: { type: string }
        status: { $ref: "#/components/schemas/TripStatus" }
        status_reason: { type: [string, "null"] }
        source_key: { $ref: "#/components/schemas/SourceKey" }
        provider_name: { type: string }
        published_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              enum:
                - internal
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - unavailable
                - too_many_requests
                - ACCESS_TOKEN_INVALID
                - ACCESS_TOKEN_EXPIRED
                - REFRESH_TOKEN_INVALID
                - SESSION_REVOKED
                - ACCOUNT_SUSPENDED
                - OTP_INVALID
                - OTP_EXPIRED
                - OTP_ATTEMPTS_EXCEEDED
            message: { type: string, description: Human-readable; may change. }
            details:
              type: object
              additionalProperties: { type: string }
              description: Field name to problem, for validation errors.
            request_id: { type: string }
            retryable: { type: boolean }

  responses:
    InvalidArgument:
      description: "`invalid_argument`, with per-field `details` when applicable"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: "`unauthorized`, `ACCESS_TOKEN_INVALID`, `ACCESS_TOKEN_EXPIRED` or `SESSION_REVOKED`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccountSuspended:
      description: "`ACCOUNT_SUSPENDED`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "`conflict`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminUnauthenticated:
      description: "`unauthorized`: missing or wrong admin token"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: "`too_many_requests`; per-IP limits also set `Retry-After`"
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: "`unavailable`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
